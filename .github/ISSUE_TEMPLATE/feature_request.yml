name: 功能建议
description: 提出新功能, 体验改进或适配建议
title: "feat: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        请说明你想解决的具体使用问题。这个项目会优先考虑桌面核心体验和现代 Android 兼容性。
  - type: textarea
    id: need
    attributes:
      label: 需求背景
      description: 你遇到了什么不方便, 或希望改善哪一类体验?
      placeholder: "例如: 某个旧插件需要单独安装, 新用户不容易找到可用版本。"
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
      description: 简单说明你希望如何改。
      placeholder: "例如: 在设置里增加入口, 或内置某个已经适配过的小部件。"
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 其他方案
      description: 如果你尝试过其他办法, 可以写在这里。
    validations:
      required: false
  - type: textarea
    id: context
    attributes:
      label: 补充信息
      description: 相关截图, 录屏, 设备信息或参考链接。
    validations:
      required: false
